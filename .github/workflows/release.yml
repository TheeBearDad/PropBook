name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 3.3.0 (creates the tag v<version> if it doesn't exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...
        env:
          PROPBOOK_SIGNING_KEY: ${{ secrets.PROPBOOK_SIGNING_KEY }}

      - name: Signing key
        id: key
        env:
          PROPBOOK_SIGNING_KEY: ${{ secrets.PROPBOOK_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PROPBOOK_SIGNING_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'SHA256SUMS.txt.sig'; then
            echo "::notice::No PROPBOOK_SIGNING_KEY secret, but v$V was already published with signed files. Nothing to do."
            echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::Add the PROPBOOK_SIGNING_KEY secret (Settings > Secrets and variables > Actions). Without it, installed copies can't verify this release."
          exit 1

      - name: Build
        if: steps.key.outputs.ok == '1'
        run: bash release/build.sh "${{ steps.v.outputs.version }}"
        env:
          PROPBOOK_SIGNING_KEY: ${{ secrets.PROPBOOK_SIGNING_KEY }}
          PROPBOOK_REPO: ${{ github.repository }}

      - name: Check signature
        if: steps.key.outputs.ok == '1'
        run: |
          go run ./tools/sign verify "$(grep -o 'updatePubKey = "[^"]*"' updater.go | cut -d'"' -f2)" dist/SHA256SUMS.txt

      - name: Publish
        if: steps.key.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES="release/notes/$V.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
          else
            gh release create "v$V" dist/* --title "PropBook $V" "${ARGS[@]}"
          fi
