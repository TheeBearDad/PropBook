name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 3.3.1 (the tag v<version> must exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...
        env:
          PROPBOOK_SIGNING_KEY: ${{ secrets.PROPBOOK_SIGNING_KEY }}

      - name: Build
        run: |
          if [ -z "$PROPBOOK_SIGNING_KEY" ]; then
            echo "::error::The PROPBOOK_SIGNING_KEY secret isn't set, so installed copies couldn't verify this release."
            exit 1
          fi
          bash release/build.sh "${{ steps.v.outputs.version }}"
        env:
          PROPBOOK_SIGNING_KEY: ${{ secrets.PROPBOOK_SIGNING_KEY }}
          PROPBOOK_REPO: ${{ github.repository }}

      - name: Check signature
        run: |
          go run ./tools/sign verify "$(grep -o 'updatePubKey = "[^"]*"' updater.go | cut -d'"' -f2)" dist/SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          NOTES="release/notes/$V.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
          else
            gh release create "v$V" dist/* --title "PropBook $V" "${ARGS[@]}"
          fi
